<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Private World ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root { --pink-bg: #fff5f7; --main-pink: #d81b60; --box-bg: white; --text-color: #444; }
        body.dark-mode { --pink-bg: #1a1a1a; --main-pink: #ff4081; --box-bg: #2d2d2d; --text-color: #eee; }
        
        body { background-color: var(--pink-bg); margin: 0; font-family: 'Cairo', sans-serif; transition: 0.3s; color: var(--text-color); overflow-x: hidden; }

        /* شاشة تأثير الحب الكاملة */
        #love-overlay { 
            position: fixed; inset: 0; background: rgba(216, 27, 96, 0.9); 
            display: none; flex-direction: column; justify-content: center; 
            align-items: center; z-index: 3000; animation: fadeIn 0.5s;
            background: linear-gradient(45deg, #d81b60, #ff4081);
        }
        .floating-heart { position: absolute; color: white; animation: floatUp 4s infinite linear; opacity: 0.8; }
        @keyframes floatUp { from { transform: translateY(100vh) scale(0.5); opacity: 1; } to { transform: translateY(-10vh) scale(1.5); opacity: 0; } }

        #dark-mode-toggle { position: fixed; top: 15px; right: 15px; background: var(--main-pink); color: white; border: none; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; z-index: 1100; font-size: 1.2rem; display: none; }
        #intro-screen { position: fixed; inset: 0; background: var(--pink-bg); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        #login { display: none; height: 100vh; flex-direction: column; justify-content: center; align-items: center; }
        .password-content { background: var(--box-bg); padding: 35px; border-radius: 25px; text-align: center; width: 85%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        input[type="password"] { width: 80%; padding: 12px; border-radius: 12px; border: 1px solid #eee; text-align: center; font-size: 1.2rem; outline: none; margin-bottom: 20px; background: var(--box-bg); color: var(--main-pink); }
        .enter-btn { background: var(--main-pink); color: white; border: none; padding: 12px 45px; border-radius: 12px; font-weight: bold; cursor: pointer; }

        #main-content { display: none; width: 100%; max-width: 500px; padding: 20px; margin: auto; }
        .nav-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; background: var(--box-bg); padding: 10px; border-radius: 20px; margin-bottom: 20px; }
        .tab-btn { cursor: pointer; padding: 8px; border-radius: 12px; font-size: 0.7rem; font-weight: bold; color: #888; text-align: center; }
        .tab-btn.active { background: var(--main-pink); color: white; }
        
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.5s; }
        .box { background: var(--box-bg); border-radius: 25px; padding: 20px; margin-bottom: 20px; text-align: center; }
        .title-text { font-family: 'Great Vibes', cursive; color: var(--main-pink); font-size: 2.2rem; }
        
        canvas { border: 2px dashed var(--main-pink); border-radius: 15px; background: white; width: 100%; max-width: 300px; height: 300px; touch-action: none; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="love-overlay">
        <h1 class="title-text" style="color: white; font-size: 4rem;">أعشقكِ ❤️</h1>
    </div>

    <button id="dark-mode-toggle" onclick="toggleDarkMode()">🌙</button>

    <div id="intro-screen"><h1 class="title-text" style="font-size: 3rem;">Welcome my love..</h1></div>

    <div id="login">
        <div class="password-content">
            <h3 style="color: var(--main-pink);">Enter Our Date</h3>
            <input type="password" id="passCode" placeholder="••••••••">
            <button class="enter-btn" onclick="checkPass()">Enter</button>
        </div>
    </div>

    <div id="main-content">
        <div class="nav-tabs">
            <div class="tab-btn active" onclick="showTab('notes')">Story</div>
            <div class="tab-btn" onclick="showTab('draw')">بصمة حبنا</div>
            <div class="tab-btn" onclick="showTab('mood')">Mood</div>
            <div class="tab-btn" onclick="showTab('gallery')">Gallery</div>
        </div>

        <div id="notes" class="section active">
            <div class="box">
                <span class="title-text">Our Story</span>
                <div id="notesList" style="margin-bottom: 15px;"></div>
                <textarea id="noteText" style="width:90%; height:60px; border-radius:15px; padding:10px;"></textarea><br><br>
                <button class="enter-btn" onclick="saveWithEffect()">ارسال ❤️</button>
            </div>
        </div>

        <div id="draw" class="section">
            <div class="box">
                <span class="title-text">بصمة حبنا</span><br>
                <canvas id="paintCanvas"></canvas><br>
                <button class="enter-btn" style="padding:8px; margin-top:10px;" onclick="saveDrawing()">Send Drawing</button>
            </div>
        </div>

        <div id="mood" class="section">
            <div class="box"><span class="title-text">How are you?</span><div id="currentMood">...</div><button onclick="setMood('😍')">😍</button><button onclick="setMood('🥺')">🥺</button></div>
        </div>

        <div id="gallery" class="section">
            <div class="box"><span class="title-text">Gallery</span><div id="galleryGrid"></div></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA8gmiGLE-ALqyf_Urbhzfjl2g1-bU",
            authDomain: "our-special-world-d1905.firebaseapp.com",
            projectId: "our-special-world-d1905",
            storageBucket: "our-special-world-d1905.firebasestorage.app",
            messagingSenderId: "638515017777",
            appId: "1:638515017777:web:b25873ee282b0c19b67320"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // وظيفة تأثير الحب الكامل
        window.saveWithEffect = async () => {
            const txt = document.getElementById('noteText').value;
            if(!txt) return;

            if(txt.includes("أحبك") || txt.includes("أعشقك") || txt.includes("احبج") || txt.includes("اعشقج")) {
                const overlay = document.getElementById('love-overlay');
                overlay.style.display = 'flex';
                // صنع قلوب طائرة
                for(let i=0; i<30; i++) {
                    let h = document.createElement('div'); h.className='floating-heart'; h.innerHTML='❤️';
                    h.style.left = Math.random()*100+'vw'; h.style.animationDelay = Math.random()*2+'s';
                    overlay.appendChild(h);
                }
                setTimeout(() => { overlay.style.display = 'none'; overlay.innerHTML = '<h1 class="title-text" style="color: white; font-size: 4rem;">أعشقكِ ❤️</h1>'; }, 4000);
            }
            await addDoc(collection(db, "notes"), { text: txt, createdAt: serverTimestamp() });
            document.getElementById('noteText').value = '';
        };

        window.toggleDarkMode = () => {
            document.body.classList.toggle('dark-mode');
            document.getElementById('dark-mode-toggle').innerText = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
        };

        window.checkPass = () => {
            if(document.getElementById('passCode').value === "28/6/2009") {
                document.getElementById('login').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('dark-mode-toggle').style.display = 'block';
            } else { alert("Correct the date!"); }
        };

        window.onload = () => { setTimeout(() => { document.getElementById('intro-screen').style.display = 'none'; document.getElementById('login').style.display = 'flex'; }, 2500); };

        window.showTab = (id) => {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        };

        // نظام الرسم البسيط (Canvas)
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        let painting = false;
        canvas.width = 300; canvas.height = 300;
        ctx.strokeStyle = '#d81b60'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        canvas.onmousedown = () => painting = true;
        canvas.onmouseup = () => { painting = false; ctx.beginPath(); };
        canvas.onmousemove = (e) => {
            if(!painting) return;
            ctx.lineTo(e.clientX - canvas.getBoundingClientRect().left, e.clientY - canvas.getBoundingClientRect().top);
            ctx.stroke(); ctx.beginPath(); ctx.moveTo(e.clientX - canvas.getBoundingClientRect().left, e.clientY - canvas.getBoundingClientRect().top);
        };
        // تشغيل البقية (Firebase) بنفس الطريقة السابقة
    </script>
</body>
</html>
