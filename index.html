<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Private World ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Cairo:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root { --pink-bg: #fff5f7; --main-pink: #d81b60; }
        body { background-color: var(--pink-bg); margin: 0; padding: 0; font-family: 'Cairo', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        #intro-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--pink-bg); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        #login { display: none; height: 100vh; flex-direction: column; justify-content: center; align-items: center; width: 100%; }
        .password-content { background: white; padding: 35px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); text-align: center; width: 85%; max-width: 400px; }
        input[type="password"] { width: 80%; padding: 12px; margin-bottom: 20px; border: 1px solid #eee; border-radius: 12px; text-align: center; font-size: 1.2rem; }
        .enter-btn { background-color: var(--main-pink); color: white; border: none; padding: 12px 45px; border-radius: 12px; cursor: pointer; font-weight: bold; }
        #main-content { display: none; width: 100%; max-width: 500px; padding: 20px; }
        .nav-tabs { display: flex; justify-content: space-around; background: white; padding: 10px; border-radius: 20px; margin-bottom: 20px; }
        .tab-btn { cursor: pointer; padding: 8px 15px; border-radius: 15px; font-size: 0.85rem; font-weight: bold; color: #888; }
        .tab-btn.active { background: var(--main-pink); color: white; }
        .section { display: none; }
        .section.active { display: block; }
        .box { background: white; border-radius: 25px; padding: 25px; margin-bottom: 20px; text-align: center; }
        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .img-container { position: relative; height: 110px; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; border-radius: 15px; }
        .list-item { display: flex; justify-content: space-between; align-items: center; background: #fffafb; padding: 12px; border-radius: 15px; margin-bottom: 10px; border-left: 4px solid var(--main-pink); }
    </style>
</head>
<body>

    <div id="intro-screen"><h1 style="color:var(--main-pink); font-family:'Great Vibes'">Welcome my love..</h1></div>

    <div id="login">
        <div class="password-content">
            <h3 style="color: var(--main-pink);">Enter our special date</h3>
            <input type="password" id="passCode" placeholder="••••••••">
            <button class="enter-btn" onclick="checkPass()">Enter</button>
        </div>
    </div>

    <div id="main-content">
        <div class="nav-tabs">
            <div class="tab-btn active" onclick="showTab('music')">Music</div>
            <div class="tab-btn" onclick="showTab('notes')">Memories</div>
            <div class="tab-btn" onclick="showTab('gallery')">Gallery</div>
        </div>

        <div id="music" class="section active">
            <div class="box"><h3>Our Music</h3><div id="songsList"></div><input type="text" id="sName" placeholder="Song Name"><input type="text" id="sUrl" placeholder="Link"><button onclick="addData('songs')">Add</button></div>
        </div>

        <div id="notes" class="section">
            <div class="box"><h3>Our Story</h3><div id="notesList"></div><textarea id="noteText" placeholder="Write here.."></textarea><button onclick="addData('notes')">Save</button></div>
        </div>

        <div id="gallery" class="section">
            <div class="box"><h3>Gallery</h3><label class="enter-btn" style="padding:10px;">Upload<input type="file" id="imgInp" hidden onchange="uploadImg(event)"></label><div class="gallery-grid" id="galleryGrid"></div></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // المفاتيح من صورتك
        const firebaseConfig = {
          apiKey: "AIzaSyA8gmiGLE-ALqyf_Urbhzfjl2g1-bU",
          authDomain: "our-special-world-d1905.firebaseapp.com",
          projectId: "our-special-world-d1905",
          storageBucket: "our-special-world-d1905.firebasestorage.app",
          messagingSenderId: "638515017777",
          appId: "1:638515017777:web:b25873ee282b0c19b67320"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.checkPass = () => {
            if(document.getElementById('passCode').value === "28/6/2009") {
                document.getElementById('login').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            } else { alert("Correct the date!"); }
        };

        window.addData = async (type) => {
            let data = {};
            if(type === 'songs') data = { n: document.getElementById('sName').value, u: document.getElementById('sUrl').value };
            else data = { text: document.getElementById('noteText').value };
            data.createdAt = serverTimestamp();
            await addDoc(collection(db, type), data);
        };

        window.uploadImg = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = async (ev) => {
                await addDoc(collection(db, "imgs"), { src: ev.target.result, createdAt: serverTimestamp() });
            };
            reader.readAsDataURL(file);
        };

        const listen = (col, el, temp) => {
            onSnapshot(query(collection(db, col), orderBy("createdAt", "desc")), (snap) => {
                document.getElementById(el).innerHTML = snap.docs.map(doc => temp(doc.data())).join('');
            });
        };

        listen('songs', 'songsList', d => `<div class="list-item"><a href="${d.u}" target="_blank">🎵 ${d.n}</a></div>`);
        listen('notes', 'notesList', d => `<div class="list-item"><span>${d.text}</span></div>`);
        listen('imgs', 'galleryGrid', d => `<div class="img-container"><img src="${d.src}"></div>`);

        setTimeout(() => { document.getElementById('intro-screen').style.display = 'none'; document.getElementById('login').style.display = 'flex'; }, 2000);
        window.showTab = (id) => { document.querySelectorAll('.section').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); };
    </script>
</body>
</html>
