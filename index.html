<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Private World ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Cairo:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root { --pink-bg: #fff5f7; --main-pink: #d81b60; --soft-pink: #fce4ec; --text-color: #444; --box-bg: white; }
        body.dark-mode { --pink-bg: #1a1a1a; --main-pink: #ff4081; --soft-pink: #2d2d2d; --text-color: #eee; --box-bg: #2d2d2d; }
        
        body { background-color: var(--pink-bg); margin: 0; padding: 0; font-family: 'Cairo', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; transition: 0.3s; color: var(--text-color); }
        
        #dark-toggle { position: fixed; top: 15px; right: 15px; background: var(--main-pink); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; z-index: 1100; font-size: 1.2rem; display: none; }

        #intro-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--pink-bg); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        #login { display: none; height: 100vh; flex-direction: column; justify-content: center; align-items: center; width: 100%; }
        .password-content { background: var(--box-bg); padding: 35px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); text-align: center; max-width: 400px; width: 85%; }
        input[type="password"] { width: 80%; padding: 12px; margin-bottom: 20px; border: 1px solid #eee; border-radius: 12px; text-align: center; outline: none; font-size: 1.2rem; color: var(--main-pink); background: var(--box-bg); }
        .enter-btn { background-color: var(--main-pink); color: white; border: none; padding: 12px 45px; border-radius: 12px; cursor: pointer; font-weight: bold; }

        #main-content { display: none; width: 100%; max-width: 500px; padding: 20px; animation: fadeIn 1s; }
        .nav-tabs { display: flex; justify-content: space-around; background: var(--box-bg); padding: 10px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.03); overflow-x: auto; }
        .tab-btn { cursor: pointer; padding: 8px 12px; border-radius: 15px; font-size: 0.75rem; font-weight: bold; color: #888; white-space: nowrap; }
        .tab-btn.active { background: var(--main-pink); color: white; }

        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.5s; }
        .box { background: var(--box-bg); border-radius: 25px; padding: 25px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
        .title-text { font-family: 'Great Vibes', cursive; color: var(--main-pink); font-size: 2.2rem; margin-bottom: 15px; display: block; text-align: center; }

        /* استايل اللوحة المعلقة مع زر الحذف */
        .hanging-frame { position: relative; margin: 30px auto; width: 220px; height: 220px; background: #fff; border: 8px solid #5d4037; box-shadow: 0 10px 20px rgba(0,0,0,0.3); transform: rotate(-2deg); transition: 0.5s; }
        .hanging-frame::before { content: ''; position: absolute; top: -25px; left: 50%; transform: translateX(-50%); width: 10px; height: 10px; background: #333; border-radius: 50%; z-index: 2; }
        .hanging-frame::after { content: ''; position: absolute; top: -22px; left: 50%; transform: translateX(-50%); width: 60px; height: 2px; background: #8d6e63; transform: rotate(-35deg) translateX(-30px); z-index: 1; }
        .hanging-frame img { width: 100%; height: 100%; object-fit: contain; }
        
        .del-art { position: absolute; top: -10px; right: -10px; background: #ff4d4d; color: white; border: 2px solid white; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 14px; z-index: 10; }

        canvas { border: 2px dashed var(--main-pink); border-radius: 15px; background: white; width: 100%; max-width: 300px; height: 300px; touch-action: none; display: block; margin: 0 auto; }
        .list-item { display: flex; justify-content: space-between; align-items: center; background: var(--soft-pink); padding: 12px; border-radius: 15px; margin-bottom: 10px; border-left: 4px solid var(--main-pink); }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <button id="dark-toggle" onclick="toggleDark()">🌙</button>

    <div id="intro-screen"><h1 class="title-text" style="font-size: 2.5rem;">Welcome my love..</h1></div>

    <div id="login">
        <div class="password-content">
            <h3 style="font-family: 'Great Vibes', cursive; color: var(--main-pink);">Enter our special date</h3>
            <input type="password" id="passCode" placeholder="••••••••">
            <br>
            <button class="enter-btn" onclick="checkPass()">Enter</button>
        </div>
    </div>

    <div id="main-content">
        <div class="nav-tabs">
            <div class="tab-btn active" onclick="showTab('letter')">Letter</div>
            <div class="tab-btn" onclick="showTab('draw')">The Paintings of My Beauty</div>
            <div class="tab-btn" onclick="showTab('music')">Music</div>
            <div class="tab-btn" onclick="showTab('notes')">Memories</div>
            <div class="tab-btn" onclick="showTab('gallery')">Gallery</div>
        </div>

        <div id="letter" class="section active">
            <div class="box"><span class="title-text">My Dearest Naboushti..</span><p style="text-align:center; font-family:'Dancing Script'; font-size:1.3rem;">This website was created just for you...</p></div>
        </div>

        <div id="draw" class="section">
            <div class="box">
                <span class="title-text">The Paintings of My Beauty</span>
                <div id="frameDisplay" style="display:none;">
                    <div class="hanging-frame">
                        <div class="del-art" onclick="deleteArt()">×</div>
                        <img id="lastDrawing" src="">
                    </div>
                </div>
                <canvas id="paintCanvas"></canvas>
                <div style="text-align:center; margin-top:15px;">
                    <button class="enter-btn" style="padding:8px 20px;" onclick="saveDrawing()">ارسال اللوحة ❤️</button>
                    <button class="enter-btn" style="padding:8px 20px; background:#888;" onclick="clearCanvas()">مسح</button>
                </div>
            </div>
        </div>

        <div id="music" class="section"><div class="box"><span class="title-text">Our Music</span><div id="songsList"></div></div></div>
        <div id="notes" class="section"><div class="box"><span class="title-text">Our Story</span><div id="notesList"></div></div></div>
        <div id="gallery" class="section"><div class="box"><span class="title-text">Gallery</span><div id="galleryGrid" class="gallery-grid"></div></div></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, deleteDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA8gmiGlE-ALQyf_Urbhzfjl2g1-BQrCBM",
            authDomain: "our-special-world-d1905.firebaseapp.com",
            projectId: "our-special-world-d1905",
            storageBucket: "our-special-world-d1905.firebasestorage.app",
            messagingSenderId: "638515017777",
            appId: "1:638515017777:web:b25873ee282b0c19987d10"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.toggleDark = () => {
            document.body.classList.toggle('dark-mode');
            document.getElementById('dark-toggle').innerText = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
        };

        window.checkPass = function() {
            if(document.getElementById('passCode').value === "28/6/2009") {
                document.getElementById('login').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('dark-toggle').style.display = 'block';
            } else { alert("Correct the date!"); }
        };

        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        let painting = false; canvas.width = 300; canvas.height = 300;
        ctx.strokeStyle = '#d81b60'; ctx.lineWidth = 4; ctx.lineCap = 'round';

        const getPos = (e) => {
            const rect = canvas.getBoundingClientRect();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: cx - rect.left, y: cy - rect.top };
        };
        canvas.onmousedown = (e) => { painting = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
        canvas.onmousemove = (e) => { if(!painting) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
        canvas.onmouseup = () => painting = false;
        canvas.ontouchstart = (e) => { e.preventDefault(); painting = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
        canvas.ontouchmove = (e) => { e.preventDefault(); if(!painting) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };

        window.clearCanvas = () => ctx.clearRect(0, 0, 300, 300);
        window.saveDrawing = async () => {
            const dataUrl = canvas.toDataURL();
            await setDoc(doc(db, "status", "latest_art"), { img: dataUrl, timestamp: serverTimestamp() });
            alert("تم تعليق اللوحة! ❤️");
        };

        window.deleteArt = async () => {
            if(confirm("حذف اللوحة نهائياً؟")) {
                await deleteDoc(doc(db, "status", "latest_art"));
                document.getElementById('frameDisplay').style.display = 'none';
            }
        };

        onSnapshot(doc(db, "status", "latest_art"), (d) => {
            if(d.exists()) {
                document.getElementById('frameDisplay').style.display = 'block';
                document.getElementById('lastDrawing').src = d.data().img;
            } else {
                document.getElementById('frameDisplay').style.display = 'none';
            }
        });

        onSnapshot(query(collection(db, "songs"), orderBy("createdAt", "desc")), (s) => {
            document.getElementById('songsList').innerHTML = s.docs.map(d => `<div class="list-item"><a href="${d.data().u}" target="_blank">🎵 ${d.data().n}</a></div>`).join('');
        });
        onSnapshot(query(collection(db, "notes"), orderBy("createdAt", "desc")), (s) => {
            document.getElementById('notesList').innerHTML = s.docs.map(d => `<div class="list-item">${d.data().text}</div>`).join('');
        });

        window.showTab = (id) => {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        };

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('intro-screen').style.display = 'none';
                document.getElementById('login').style.display = 'flex';
            }, 2500);
        };
    </script>
</body>
</html>
