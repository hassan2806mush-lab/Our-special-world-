<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Private World ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root { --pink-bg: #fff5f7; --main-pink: #d81b60; --box-bg: white; --text-color: #444; }
        body.dark-mode { --pink-bg: #1a1a1a; --main-pink: #ff4081; --box-bg: #2d2d2d; --text-color: #eee; }
        body { background-color: var(--pink-bg); margin: 0; font-family: 'Cairo', sans-serif; transition: 0.3s; color: var(--text-color); overflow-x: hidden; }
        #love-overlay { position: fixed; inset: 0; background: linear-gradient(45deg, #d81b60, #ff4081); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 3000; }
        .floating-heart { position: absolute; color: white; animation: floatUp 4s infinite linear; pointer-events: none; }
        @keyframes floatUp { from { transform: translateY(100vh) scale(0.5); opacity: 1; } to { transform: translateY(-10vh) scale(1.5); opacity: 0; } }
        #dark-mode-toggle { position: fixed; top: 15px; right: 15px; background: var(--main-pink); color: white; border: none; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; z-index: 1100; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        #intro-screen { position: fixed; inset: 0; background: var(--pink-bg); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        #login { display: none; height: 100vh; flex-direction: column; justify-content: center; align-items: center; }
        .password-content { background: var(--box-bg); padding: 35px; border-radius: 25px; text-align: center; width: 85%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        input[type="password"] { width: 80%; padding: 12px; border-radius: 12px; border: 1px solid #eee; text-align: center; font-size: 1.2rem; outline: none; margin-bottom: 20px; background: var(--box-bg); color: var(--main-pink); }
        .enter-btn { background: var(--main-pink); color: white; border: none; padding: 12px 45px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .enter-btn:hover { transform: scale(1.05); }
        #main-content { display: none; width: 100%; max-width: 500px; padding: 20px; margin: auto; animation: fadeIn 0.8s; }
        .nav-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; background: var(--box-bg); padding: 10px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .tab-btn { cursor: pointer; padding: 10px 5px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; color: #888; text-align: center; transition: 0.3s; }
        .tab-btn.active { background: var(--main-pink); color: white; }
        .section { display: none; }
        .section.active { display: block; }
        .box { background: var(--box-bg); border-radius: 25px; padding: 20px; margin-bottom: 20px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
        .title-text { font-family: 'Great Vibes', cursive; color: var(--main-pink); font-size: 2.5rem; margin-bottom: 10px; display: block; }
        canvas { border: 2px dashed var(--main-pink); border-radius: 15px; background: white; width: 100%; max-width: 300px; height: 300px; touch-action: none; cursor: crosshair; }
        #galleryGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 15px; }
        #galleryGrid img { width: 100%; height: 100px; object-fit: cover; border-radius: 10px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="love-overlay"><h1 class="title-text" style="color: white; font-size: 4rem; text-shadow: 0 0 20px rgba(0,0,0,0.2);">أعشقكِ ❤️</h1></div>
    <button id="dark-mode-toggle" onclick="toggleDarkMode()">🌙</button>
    <div id="intro-screen"><h1 class="title-text" style="font-size: 3.5rem;">Welcome my love..</h1></div>
    <div id="login">
        <div class="password-content">
            <h3 style="color: var(--main-pink); margin-top: 0;">Enter Our Special Date</h3>
            <input type="password" id="passCode" placeholder="••••••••">
            <button class="enter-btn" onclick="checkPass()">Enter</button>
        </div>
    </div>
    <div id="main-content">
        <div class="nav-tabs">
            <div class="tab-btn active" onclick="showTab('notes')">Story</div>
            <div class="tab-btn" onclick="showTab('draw')">بصمة حبنا</div>
            <div class="tab-btn" onclick="showTab('mood')">Mood</div>
            <div class="tab-btn" onclick="showTab('gallery')">Gallery</div>
        </div>
        <div id="notes" class="section active">
            <div class="box"><span class="title-text">Our Story</span><div id="notesList" style="text-align: right; max-height: 250px; overflow-y: auto; margin-bottom: 15px; padding: 5px;"></div>
            <textarea id="noteText" placeholder="اكتب شيئاً... (جرب: أحبك)" style="width:90%; height:80px; border-radius:15px; padding:10px; border:1px solid #eee; outline:none; font-family: 'Cairo';"></textarea><br><br>
            <button class="enter-btn" onclick="saveWithEffect()">ارسال ❤️</button></div>
        </div>
        <div id="draw" class="section">
            <div class="box"><span class="title-text">بصمة حبنا</span><br><canvas id="paintCanvas"></canvas><br>
            <button class="enter-btn" style="padding:10px 20px; margin-top:10px;" onclick="saveDrawing()">ارسال الرسمة</button>
            <button class="enter-btn" style="padding:10px 20px; margin-top:10px; background:#888;" onclick="clearCanvas()">مسح</button></div>
        </div>
        <div id="mood" class="section">
            <div class="box"><span class="title-text">How are you?</span><div id="currentMood" style="font-size: 1.5rem; margin-bottom: 15px;">...</div>
            <div style="display:flex; justify-content:center; gap:15px;">
                <button onclick="setMood('😍')" style="font-size:2rem; border:none; background:none; cursor:pointer;">😍</button>
                <button onclick="setMood('🥺')" style="font-size:2rem; border:none; background:none; cursor:pointer;">🥺</button>
                <button onclick="setMood('😔')" style="font-size:2rem; border:none; background:none; cursor:pointer;">😔</button>
                <button onclick="setMood('😴')" style="font-size:2rem; border:none; background:none; cursor:pointer;">😴</button>
            </div></div>
        </div>
        <div id="gallery" class="section">
            <div class="box"><span class="title-text">Gallery</span>
            <input type="file" id="imgInp" multiple style="display:none" onchange="uploadImages(event)">
            <label for="imgInp" class="enter-btn" style="padding: 10px 25px; display:inline-block; cursor:pointer;">Upload Photo</label>
            <div id="galleryGrid"></div></div>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        const firebaseConfig = { apiKey: "AIzaSyA8gmiGLE-ALqyf_Urbhzfjl2g1-bU", authDomain: "our-special-world-d1905.firebaseapp.com", projectId: "our-special-world-d1905", storageBucket: "our-special-world-d1905.firebasestorage.app", messagingSenderId: "638515017777", appId: "1:638515017777:web:b25873ee282b0c19b67320" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app);
        window.saveWithEffect = async () => {
            const txt = document.getElementById('noteText').value; if(!txt) return;
            if(txt.includes("أحبك") || txt.includes("أعشقك") || txt.includes("احبج") || txt.includes("اعشقج")) {
                const overlay = document.getElementById('love-overlay'); overlay.style.display = 'flex';
                for(let i=0; i<40; i++) { 
                    let h = document.createElement('div'); h.className='floating-heart'; h.innerHTML=['❤️','💖','✨'][Math.floor(Math.random()*3)];
                    h.style.left = Math.random()*100+'vw'; h.style.animationDuration = (Math.random()*2+2)+'s'; overlay.appendChild(h); 
                }
                setTimeout(() => { overlay.style.display = 'none'; overlay.querySelectorAll('.floating-heart').forEach(h => h.remove()); }, 4000);
            }
            await addDoc(collection(db, "notes"), { text: txt, createdAt: serverTimestamp() });
            document.getElementById('noteText').value = '';
        };
        window.toggleDarkMode = () => { document.body.classList.toggle('dark-mode'); document.getElementById('dark-mode-toggle').innerText = document.body.classList.contains('dark-mode') ? '☀️' : '🌙'; };
        window.checkPass = () => { if(document.getElementById('passCode').value === "28/6/2009") { document.getElementById('login').style.display = 'none'; document.getElementById('main-content').style.display = 'block'; document.getElementById('dark-mode-toggle').style.display = 'block'; } else { alert("Correct the date!"); } };
        window.onload = () => { setTimeout(() => { document.getElementById('intro-screen').style.display = 'none'; document.getElementById('login').style.display = 'flex'; }, 2500); };
        window.showTab = (id) => { document.querySelectorAll('.section').forEach(s => s.classList.remove('active')); document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); document.getElementById(id).classList.add('active'); event.currentTarget.classList.add('active'); };
        onSnapshot(query(collection(db, "notes"), orderBy("createdAt", "desc")), (snap) => { document.getElementById('notesList').innerHTML = snap.docs.map(doc => `<div style="padding:12px; border-bottom:1px solid rgba(0,0,0,0.05); text-align:right;">${doc.data().text}</div>`).join(''); });
        const canvas = document.getElementById('paintCanvas'); const ctx = canvas.getContext('2d'); canvas.width = 300; canvas.height = 300; ctx.strokeStyle = '#d81b60'; ctx.lineWidth = 4; ctx.lineCap = 'round';
        let painting = false; const getPos = (e) => { const r = canvas.getBoundingClientRect(); return { x: (e.touches ? e.touches[0].clientX : e.clientX) - r.left, y: (e.touches ? e.touches[0].clientY : e.clientY) - r.top }; };
        const start = (e) => { painting = true; const p = getPos(e); ctx.moveTo(p.x, p.y); };
        const draw = (e) => { if(!painting) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
        canvas.onmousedown = start; canvas.onmousemove = draw; canvas.onmouseup = () => painting = false;
        canvas.ontouchstart = (e) => { e.preventDefault(); start(e); }; canvas.ontouchmove = (e) => { e.preventDefault(); draw(e); }; canvas.ontouchend = () => painting = false;
        window.saveDrawing = async () => { await setDoc(doc(db, "status", "drawing"), { img: canvas.toDataURL() }); alert("رسمتك وصلت إلها! ❤️"); };
        window.clearCanvas = () => ctx.clearRect(0,0,300,300);
        window.setMood = async (m) => { await setDoc(doc(db, "status", "mood"), { val: m }); };
        onSnapshot(doc(db, "status", "mood"), (d) => { if(d.exists()) document.getElementById('currentMood').innerText = "Feeling: " + d.data().val; });
        window.uploadImages = (e) => { for(let f of e.target.files) { const r = new FileReader(); r.onload = async (ev) => { await addDoc(collection(db, "imgs"), { src: ev.target.result, createdAt: serverTimestamp() }); }; r.readAsDataURL(f); } };
        onSnapshot(query(collection(db, "imgs"), orderBy("createdAt", "desc")), (s) => { document.getElementById('galleryGrid').innerHTML = s.docs.map(d => `<img src="${d.data().src}">`).join(''); });
    </script>
</body>
</html>
